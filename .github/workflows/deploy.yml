name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - online
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Determine pnpm store path 📦
        id: pnpm-store
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Restore pnpm store cache ♻️
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Preload dependencies into store 📥
        run: pnpm fetch

      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile

      - name: Typecheck 🧪
        run: pnpm typecheck

      - name: Build website 🔧
        env:
          STAGING: ${{ github.ref == 'refs/heads/main' }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          VIPS_CONCURRENCY: 1
        run: pnpm build

      - name: Create offline archive 📦
        run: |
          mkdir -p artifacts
          cd build
          zip -r ../artifacts/openhd-website-offline.zip .

      - name: Upload build artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build-${{ github.ref_name }}
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Upload offline archive 📥
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-offline-zip-${{ github.ref_name }}
          path: artifacts/openhd-website-offline.zip
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: ${{ github.ref == 'refs/heads/main' && 'staging' || '.' }}
          keep_files: true
