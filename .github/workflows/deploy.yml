name: Build & Deploy

# Branch model:
#   main        -> staging,    served at https://openhdfpv.org/staging/ (noindex)
#   production  -> production, served at https://openhdfpv.org/
#   gh-pages    -> build output only, written by this workflow
#
# Each run builds only the pushed branch. The other half of the site is taken
# from the current gh-pages, then gh-pages is replaced completely
# (keep_files: false), so removed pages never linger on the live site.
#
# Caches: pnpm store (setup-node) and .image-cache (AVIF/WebP keyed by content
# hash). The image cache saves most of the build time - keep its path stable.

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ github.event_name == 'pull_request' && 'PR' || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      STAGING: ${{ (github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'main' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile

      - name: Typecheck 🧪
        run: pnpm typecheck

      - name: Cache optimized images 🖼️
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: image-optimization-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            image-optimization-cache-${{ runner.os }}-

      - name: Build website 🔧
        run: pnpm build

      - name: Create offline archive 📦
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          cd build
          zip -qr ../artifacts/openhd-website-offline.zip .

      - name: Upload build artifact 📦
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.ref_name }}
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Upload offline archive 📥
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-offline-zip-${{ github.ref_name }}
          path: artifacts/openhd-website-offline.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    environment:
      name: github-pages
      url: ${{ github.ref_name == 'main' && 'https://openhdfpv.org/staging/' || 'https://openhdfpv.org/' }}
    steps:
      - name: Download build 📥
        uses: actions/download-artifact@v4
        with:
          name: website-${{ github.ref_name }}
          path: build

      - name: Checkout current gh-pages 🛎️
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: current

      - name: Assemble site 🧩
        run: |
          rm -rf current/.git
          mkdir site
          if [ "${{ github.ref_name }}" = "main" ]; then
            # keep production as is, replace /staging/
            cp -r current/. site/
            rm -rf site/staging
            cp -r build site/staging
          else
            # replace production, keep /staging/
            cp -r build/. site/
            rm -rf site/staging
            [ -d current/staging ] && cp -r current/staging site/staging
          fi

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: openhdfpv.org
          keep_files: false
          commit_message: "deploy: ${{ github.ref_name }}@${{ github.sha }}"
